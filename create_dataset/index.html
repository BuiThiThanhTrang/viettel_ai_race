<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medical NER Dataset Creator – Viettel AI Race</title>
  <meta name="description" content="Công cụ tạo dataset NER y khoa: gán nhãn thực thể TRIỆU_CHỨNG, TÊN_XÉT_NGHIỆM, KẾT_QUẢ_XÉT_NGHIỆM, CHẨN_ĐOÁN, THUỐC từ văn bản tiếng Việt." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ===== HEADER ===== -->
  <header class="app-header">
    <div class="header-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
      </div>
      <div>
        <h1 class="brand-title">Medical NER Labeler</h1>
        <p class="brand-sub">Viettel AI Race – Dataset Creator</p>
      </div>
    </div>
    <div class="header-stats">
      <div class="stat-pill">
        <span class="stat-icon">🏷️</span>
        <span id="stat-count">0</span>
        <span class="stat-label">nhãn</span>
      </div>
      <div class="stat-pill">
        <span class="stat-icon">📄</span>
        <span id="stat-file">Chưa có file</span>
      </div>
    </div>
  </header>

  <!-- ===== MAIN LAYOUT ===== -->
  <main class="app-main">
    <!-- LEFT: Document Viewer -->
    <section class="panel panel-doc" id="panel-doc">
      <div class="panel-header">
        <div class="panel-title">
          <svg viewBox="0 0 20 20" fill="currentColor" class="panel-icon"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          Văn bản
        </div>
        <label class="upload-btn" id="upload-label" for="file-input">
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM6.293 6.707a1 1 0 010-1.414l3-3a1 1 0 011.414 0l3 3a1 1 0 01-1.414 1.414L11 5.414V13a1 1 0 11-2 0V5.414L7.707 6.707a1 1 0 01-1.414 0z"/></svg>
          Upload .txt
          <input type="file" id="file-input" accept=".txt" hidden />
        </label>
      </div>

      <!-- Drop zone / Document content -->
      <div class="doc-area" id="doc-area">
        <div class="drop-zone" id="drop-zone">
          <div class="drop-icon">📂</div>
          <p class="drop-title">Kéo thả file .txt vào đây</p>
          <p class="drop-sub">hoặc nhấn <strong>Upload .txt</strong> ở trên</p>
        </div>
        <div class="doc-content" id="doc-content" hidden></div>
      </div>
    </section>

    <!-- RESIZE HANDLE -->
    <div class="resize-handle" id="resize-handle"></div>

    <!-- RIGHT: Annotation Panel -->
    <section class="panel panel-anno" id="panel-anno">
      <div class="panel-header">
        <div class="panel-title">
          <svg viewBox="0 0 20 20" fill="currentColor" class="panel-icon"><path fill-rule="evenodd" d="M17.707 9.293a1 1 0 010 1.414l-7 7a1 1 0 01-1.414 0l-7-7A.997.997 0 012 10V5a3 3 0 013-3h5c.256 0 .512.098.707.293l7 7zM5 6a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"/></svg>
          Gán nhãn
        </div>
      </div>

      <div class="anno-body">
        <!-- Selection Info -->
        <div class="form-group">
          <label class="form-label">
            <span class="label-icon">✂️</span> Văn bản được chọn
          </label>
          <textarea id="sel-text" class="form-textarea" readonly placeholder="Highlight một đoạn trong văn bản để xem nội dung tại đây..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">
            <span class="label-icon">📍</span> Vị trí (start, end)
          </label>
          <div class="position-display" id="sel-pos">
            <span class="pos-badge" id="pos-start">–</span>
            <span class="pos-sep">→</span>
            <span class="pos-badge" id="pos-end">–</span>
          </div>
        </div>

        <!-- Type selector -->
        <div class="form-group">
          <label class="form-label" for="sel-type">
            <span class="label-icon">🏷️</span> Loại thực thể
          </label>
          <div class="select-wrapper">
            <select id="sel-type" class="form-select">
              <option value="">— Chọn loại —</option>
              <option value="TRIỆU_CHỨNG">TRIỆU_CHỨNG</option>
              <option value="TÊN_XÉT_NGHIỆM">TÊN_XÉT_NGHIỆM</option>
              <option value="KẾT_QUẢ_XÉT_NGHIỆM">KẾT_QUẢ_XÉT_NGHIỆM</option>
              <option value="CHẨN_ĐOÁN">CHẨN_ĐOÁN</option>
              <option value="THUỐC">THUỐC</option>
            </select>
            <svg class="select-arrow" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
          </div>
        </div>

        <!-- Assertion multi-select -->
        <div class="form-group" id="assertion-group">
          <label class="form-label">
            <span class="label-icon">🔖</span> Assertions
            <span class="label-hint">(chỉ áp dụng cho CHẨN_ĐOÁN / THUỐC / TRIỆU_CHỨNG)</span>
          </label>
          <div class="assertion-pills" id="assertion-pills">
            <button type="button" class="pill-btn" data-value="isNegated" id="pill-negated">
              <span class="pill-check">✓</span> isNegated
            </button>
            <button type="button" class="pill-btn" data-value="isFamily" id="pill-family">
              <span class="pill-check">✓</span> isFamily
            </button>
            <button type="button" class="pill-btn" data-value="isHistorical" id="pill-historical">
              <span class="pill-check">✓</span> isHistorical
            </button>
          </div>
          <p class="assertion-hint" id="assertion-hint">Chọn loại thực thể trước để kích hoạt.</p>
        </div>

        <!-- Add button -->
        <button class="btn-add" id="btn-add" disabled>
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/></svg>
          Thêm nhãn
        </button>
      </div>

      <!-- Label list -->
      <div class="label-list-section">
        <div class="label-list-header">
          <span class="label-list-title">Danh sách nhãn</span>
          <div class="label-list-actions">
            <button class="btn-icon" id="btn-clear-all" title="Xóa tất cả">
              <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
            </button>
            <button class="btn-export" id="btn-export">
              <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
              Xuất JSON
            </button>
          </div>
        </div>
        <ul class="label-list" id="label-list">
          <li class="label-empty" id="label-empty">Chưa có nhãn nào. Hãy highlight và thêm nhãn.</li>
        </ul>
      </div>
    </section>
  </main>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
